<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fa5">
<title>Remplir mon constat ou ma déclaration de sinistre — Vitfix</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* VOICE: calme, net, rassurant — un formulaire officiel qu'on remplit sans stress
   IDEA: le constat papier IRSI, recto bleu ciel / rose des parties A et B
   PICTURE: le questionnaire lui-même, une question à la fois, barre de progression en goutte
   COLOUR and TYPE: bleu eau #0b5fa5 dominant, rose A #f6d3d3 / bleu B #d6ecf8, Archivo + Inter
   LAYOUT: une colonne de 640px, barre d'actions collée en bas pour le pouce */
:root{color-scheme:light dark;--bg:light-dark(#f4f8fb,#0a1620);--card:light-dark(#fff,#112230);--ink:light-dark(#0d1b26,#e7f0f6);--mute:light-dark(#5a6d7b,#93a8b7);--line:light-dark(#d5e1ea,#24394a);--blue:#0b5fa5;--blue2:light-dark(#e3f0fa,#13324b);--a:light-dark(#fbe3e3,#3a1f24);--aink:#c0343a;--b:light-dark(#dcf0fb,#13324b);--bink:#0b74b8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
header{background:var(--blue);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 22px max(5vw,16px,env(safe-area-inset-left));position:relative;overflow:hidden}
header h1{font:800 clamp(22px,5vw,30px)/1.05 Archivo,sans-serif;margin:0 0 4px;text-wrap:balance}
header p{margin:0;opacity:.85;font-size:14px}
header svg{position:absolute;right:-10px;top:-6px;width:120px;opacity:.18}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:6px;margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .3s}
main{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
.step.A{border-top:6px solid var(--aink)}.step.B{border-top:6px solid var(--bink)}
.kicker{font-size:13px;color:var(--mute);margin:0 0 2px}
h2{font:700 22px/1.15 Archivo,sans-serif;margin:0 0 16px}
.tag{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:800 15px Archivo,sans-serif;margin-right:8px;vertical-align:2px}
.tag.A{background:var(--aink)}.tag.B{background:var(--bink)}
.f{margin:0 0 16px}
.f>label,.f>.lab{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.f small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=date],textarea{width:100%;font:16px Inter,sans-serif;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #5fb0ec;outline-offset:1px;border-color:var(--blue)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:flex;align-items:center;gap:8px;min-height:44px;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;cursor:pointer}
.opt input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.opt input:focus-visible+span{outline:3px solid #5fb0ec}
.sub{margin:10px 0 4px 14px;padding-left:12px;border-left:3px solid var(--blue2)}
.quick{font:600 14px Inter;background:var(--blue2);color:var(--ink);border:0;border-radius:999px;padding:10px 14px;min-height:44px;margin-bottom:14px;cursor:pointer}
.sig{border:1.5px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--mute)}
.link{background:none;border:0;color:var(--blue);font:600 14px Inter;padding:8px;min-height:40px;cursor:pointer}
:root[data-theme=dark] .link,.link{color:light-dark(#0b5fa5,#7cc4f5)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
nav .in{max-width:640px;width:100%;display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:12px;font:700 16px Archivo,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5}
.recap{display:grid;gap:10px}
.recap section{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.recap h3{font:700 15px Archivo,sans-serif;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.recap dl{margin:0;font-size:14px}
.recap dt{color:var(--mute);font-size:13px;margin-top:6px}.recap dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.actions{display:grid;gap:10px;margin-top:16px}
.msg{padding:12px 14px;border-radius:10px;background:var(--blue2);font-size:14px;margin-top:12px}
.msg.err{background:light-dark(#fde3e3,#3d1d1f)}
.mailbox{font-size:14px;color:var(--mute);margin-top:6px;overflow-wrap:anywhere}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.steps button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 12px Inter;cursor:pointer;padding:0}
.steps button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.steps button.done{color:var(--ink);background:var(--blue2)}
.devis{margin-top:18px;padding:16px;border-radius:14px;background:var(--blue2);display:grid;gap:10px}
.devis h3{font:700 17px/1.25 Archivo,sans-serif;margin:0}
.devis p{margin:0;font-size:14px}
.phgrid{display:grid;gap:12px;margin-bottom:14px}
.ph{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.ph img{display:block;width:100%;max-height:260px;object-fit:cover;background:#000}
.ph figcaption{display:flex;gap:6px;align-items:center;padding:8px}
.ph figcaption input{flex:1}
.phadd{display:grid;gap:10px}
.phbtn{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 0 14px}
.modes button{min-height:46px;border:0;border-radius:10px;background:none;font:600 13px/1.2 Inter,sans-serif;color:var(--mute);cursor:pointer;padding:6px 8px}
.modes button.on{background:var(--blue);color:#fff}
.note{padding:12px 14px;border-radius:12px;background:var(--blue2);font-size:14px;margin:0 0 16px}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
select{width:100%;font:16px Inter,sans-serif;padding:11px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
.items{display:grid;gap:12px;margin-bottom:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.item input,.item select{background:var(--card)}
.item .ih{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.il{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.total{font:700 17px Archivo,sans-serif;margin:4px 0 14px}
textarea.big{min-height:170px}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<body>
<header>
  <svg viewBox="0 0 100 120" aria-hidden="true"><path d="M50 4C50 4 12 52 12 78a38 38 0 0076 0C88 52 50 4 50 4z" fill="#fff"/></svg>
  <h1 id="ttl">Constat dégâts des eaux</h1>
  <p id="sub">Formulaire IRSI — 3 exemplaires (A, B, syndic) remplis automatiquement</p>
  <div class="prog"><i id="bar"></i></div>
</header>
<main>
  <div class="modes" id="modes" role="tablist" aria-label="Document à remplir"><button type="button" role="tab" data-mode="constat">Constat amiable</button><button type="button" role="tab" data-mode="decl">Déclaration de sinistre</button><button type="button" role="tab" data-mode="contest">Contester l’indemnisation</button></div>
  <div class="steps" id="dots"></div>
  <form class="step" id="step" autocomplete="on"></form>
</main>
<nav><div class="in">
  <button class="btn" id="prev" type="button">Précédent</button>
  <button class="btn pri" id="next" type="button">Suivant</button>
</div></nav>

<script src="pdf-lib.min.js"></script>
<script>
{
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
/* Entreprise partenaire proposée pour chiffrer les travaux */
const PARTNER={nom:'Vitfix',mail:'vitfix.applis@gmail.com'};
/* Deux documents dans la même appli : constat amiable (mode « constat ») et déclaration de sinistre à l'assureur (mode « decl ») */
const MODEKEY='cdde_mode';
let mode='constat';try{const sm=localStorage.getItem(MODEKEY);if(sm==='decl'||sm==='contest')mode=sm;const q=new URLSearchParams(location.search).get('mode');if(q==='decl'||q==='constat'||q==='contest')mode=q}catch(e){}
let KEY='constatDDE_v1';
let d={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};
const today=new Date().toISOString().slice(0,10);
const YN=[['oui','Oui'],['non','Non']];

const party=P=>[
 {t:'Partie '+P+' — identité',p:P,fields:[
  {k:P+'_nom',l:'Nom et prénom',ty:'text',ac:'name'},
  {k:P+'_adresse',l:'Adresse',ty:'area'},
  {row:[{k:P+'_bat',l:'Bâtiment',ty:'text'},{k:P+'_etage',l:'Étage',ty:'text'}]},
  {k:P+'_mail',l:'Mail',ty:'email'},
  {k:P+'_tel',l:'Téléphone',ty:'tel'}]},
 {t:'Partie '+P+' — assurance',p:P,fields:[
  {row:[{k:P+'_assureur',l:'Assureur',ty:'text'},{k:P+'_contrat',l:'Contrat n°',ty:'text'}]},
  {k:P+'_sinistre',l:'Sinistre n°',ty:'text',h:'Si déjà déclaré'},
  {row:[{k:P+'_agent',l:'Agent / courtier',ty:'text'},{k:P+'_agenttel',l:'Tél. agent',ty:'tel'}]},
  {k:P+'_agentadr',l:'Adresse assureur / agent / courtier',ty:'area'}]},
 {t:'Partie '+P+' — situation',p:P,fields:[
  {k:P+'_hab',l:'S’agit-il d’un local à usage d’habitation ?',ty:'radio',o:YN},
  {k:P+'_resil',l:'La résiliation du bail a-t-elle été demandée ?',ty:'radio',o:YN},
  {k:P+'_meuble',l:'Location meublée ou saisonnière ?',ty:'radio',o:YN},
  {k:P+'_qual',l:'Vous êtes',ty:'radio',o:[['loc','Locataire / occupant non propriétaire'],['prop','Propriétaire / copropriétaire'],['syndic','Syndic'],['gerant','Gérant de l’immeuble']]},
  {k:P+'_proprio',l:'Nom et coordonnées du propriétaire ou du gérant du logement',ty:'area',if:x=>x[P+'_qual']==='loc',sub:1},
  {k:P+'_occ',l:'Propriétaire',ty:'radio',o:[['occ','Occupant'],['nonocc','Non occupant']],if:x=>x[P+'_qual']==='prop',sub:1},
  {k:P+'_dom',l:'Avez-vous subi des dommages ?',ty:'radio',o:YN},
  {k:P+'_domdesc',l:'Nature des dommages',ty:'text',h:'Ex. : plafond salle de bain taché, peinture cloquée',if:x=>x[P+'_dom']==='oui',sub:1}]}
];

const CSTEPS=[
 {t:'Le sinistre',fields:[
  {k:'adresse',l:'Adresse complète du lieu du sinistre',ty:'area'},
  {k:'date',l:'Date du dégât des eaux',ty:'date'},
  {k:'type',l:'S’agit-il',ty:'radio',o:[['maison','D’une maison particulière'],['copro','D’un immeuble en copropriété'],['locatif','D’un immeuble locatif']]},
  {k:'neuf',l:'Immeuble construit depuis moins de 10 ans ?',ty:'radio',o:YN}]},
 {t:'Syndic ou gérant',quick:1,fields:[
  {k:'syndic',l:'Nom et adresse du syndic ou du gérant',ty:'area'},
  {k:'syndictel',l:'Téléphone',ty:'tel'}]},
 ...party('A'),...party('B'),
 {t:'Cause du dégât des eaux',fields:[
  {k:'rech',l:'Une recherche de fuite a-t-elle été effectuée par un artisan ou une entreprise ?',ty:'radio',o:YN},
  {k:'rechqui',l:'Par qui ?',ty:'text',if:x=>x.rech==='oui',sub:1},
  {k:'ident',l:'La cause est-elle identifiée ?',ty:'radio',o:YN},
  {k:'repar',l:'La cause est-elle réparée ?',ty:'radio',o:YN},
  {k:'orig',l:'L’origine est située chez',ty:'radio',o:[['A','A'],['B','B'],['ailleurs','Ailleurs']]},
  {k:'origprec',l:'Préciser',ty:'text',if:x=>x.orig==='ailleurs',sub:1}]},
 {t:'Nature de la fuite',fields:[
  {k:'nat',l:'Il s’agit de (une ou plusieurs réponses)',ty:'check',o:[['canal','Fuite sur canalisation'],['appareil','Fuite ou débordement d’appareil à effet d’eau (évier, lavabo, machine à laver, chaudière, cumulus…)'],['cheneau','Fuite ou débordement de chéneaux ou gouttières'],['infil','Infiltrations'],['gel','Gel'],['autre','Autre cause']]},
  {k:'canal1',l:'Canalisation',ty:'radio',o:[['commune','Commune'],['privative','Privative']],if:x=>has(x,'nat','canal'),sub:1},
  {k:'canal2',l:'Type',ty:'radio',o:[['alim','Alimentation'],['evac','Évacuation']],if:x=>has(x,'nat','canal'),sub:1},
  {k:'canal3',l:'Accès',ty:'radio',o:[['acc','Accessible'],['nonacc','Non accessible']],if:x=>has(x,'nat','canal'),sub:1},
  {k:'infil',l:'Infiltrations par',ty:'check',o:[['toiture','Toiture'],['terrasse','Terrasse'],['facade','Façade'],['fenetre','Fenêtre ou porte-fenêtre'],['joint','Joint d’étanchéité (sanitaire ou carrelage)']],if:x=>has(x,'nat','infil'),sub:1},
  {k:'autretxt',l:'Laquelle ?',ty:'text',if:x=>has(x,'nat','autre'),sub:1}]},
 {t:'Responsabilité d’un tiers',fields:[
  {k:'entr',l:'Un entrepreneur, un installateur ou un vendeur vous paraît-il être à l’origine du sinistre ?',ty:'radio',o:YN},
  {k:'entrpq',l:'Préciser pourquoi',ty:'area',if:x=>x.entr==='oui',sub:1},
  {k:'entrnom',l:'Nom et adresse',ty:'area',if:x=>x.entr==='oui',sub:1}]},
 {t:'Signatures',sign:['A','B'],fields:[
  {row:[{k:'faita',l:'Fait à',ty:'text'},{k:'le',l:'Le',ty:'date'}]}]},
 {t:'Photos du sinistre',photos:1,fields:[]},
 {t:'Récapitulatif et envoi',recap:1,fields:[]}
];

/* ---------- Déclaration de sinistre à l'assureur (art. L113-2 du Code des assurances) ---------- */
const TYPES=[['vol','Vol ou cambriolage'],['incendie','Incendie ou explosion'],['dde','Dégât des eaux'],['bris','Bris de glace'],['tempete','Tempête, grêle ou neige'],['catnat','Catastrophe naturelle (inondation, sécheresse…)'],['vandal','Vandalisme'],['autre','Autre']];
const TL={vol:'vol',incendie:'incendie',dde:'dégât des eaux',bris:'bris de glace',tempete:'tempête, grêle ou neige',catnat:'catastrophe naturelle',vandal:'acte de vandalisme'};
const tlab=x=>x.type==='autre'?(clean1(x.autretype)||'sinistre'):(TL[x.type]||'sinistre');
const isVol=x=>x.type==='vol',needPlainte=x=>x.type==='vol'||x.type==='vandal';
const DSTEPS=[
 {t:'Le sinistre',delai:1,fields:[
  {k:'type',l:'De quel sinistre s’agit-il ?',ty:'radio',o:TYPES},
  {k:'autretype',l:'Lequel ?',ty:'text',if:x=>x.type==='autre',sub:1},
  {row:[{k:'date',l:'Date du sinistre',ty:'date'},{k:'heure',l:'Heure (si connue)',ty:'text'}]},
  {k:'decouv',l:'Date de découverte, si elle est différente',ty:'date',h:'Ex. : cambriolage découvert au retour de vacances'},
  {k:'catdate',l:'Date de publication de l’arrêté de catastrophe naturelle au Journal officiel',ty:'date',if:x=>x.type==='catnat',sub:1}]},
 {t:'Vous, l’assuré',fields:[
  {k:'nom',l:'Nom et prénom',ty:'text',ac:'name'},
  {k:'adr',l:'Adresse',ty:'area'},
  {row:[{k:'tel',l:'Téléphone',ty:'tel'},{k:'mail',l:'Mail',ty:'email'}]},
  {k:'qual',l:'Vous êtes',ty:'radio',o:[['loc','Locataire'],['po','Propriétaire occupant'],['pno','Propriétaire non occupant'],['autre','Autre']]}]},
 {t:'Votre assureur',fields:[
  {k:'assureur',l:'Nom de l’assureur',ty:'text',h:'Il figure sur votre contrat ou votre avis d’échéance.'},
  {k:'assadr',l:'Adresse de l’assureur, de l’agence ou du courtier',ty:'area'},
  {row:[{k:'contrat',l:'N° de contrat',ty:'text'},{k:'sinistre',l:'N° de sinistre',ty:'text',h:'Si déjà déclaré par téléphone'}]},
  {k:'ctype',l:'Type de contrat',ty:'radio',o:[['mrh','Multirisque habitation'],['pno','Propriétaire non occupant'],['auto','Automobile'],['autre','Autre']]}]},
 {t:'Lieu et circonstances',fields:[
  {k:'lieu',l:'Adresse du lieu du sinistre',ty:'area',h:'Laissez vide si c’est votre adresse.'},
  {k:'recit',l:'Que s’est-il passé ?',ty:'area',big:1,h:'Décrivez simplement, dans l’ordre : ce que vous avez constaté et, si vous le savez, comment c’est arrivé.'},
  {k:'effr',l:'Y a-t-il eu effraction ?',ty:'radio',o:YN,if:isVol},
  {k:'effrdesc',l:'Comment ? (porte forcée, fenêtre brisée, serrure arrachée…)',ty:'text',if:x=>isVol(x)&&x.effr==='oui',sub:1},
  {k:'plainte',l:'Avez-vous déposé plainte ?',ty:'radio',o:YN,if:needPlainte,h:'Au commissariat, à la gendarmerie ou en ligne (pré-plainte). L’assureur demandera le récépissé.'},
  {row:[{k:'pdate',l:'Date de la plainte',ty:'date'},{k:'pno',l:'N° de procès-verbal',ty:'text'}],if:x=>needPlainte(x)&&x.plainte==='oui',sub:1},
  {k:'pou',l:'Commissariat ou gendarmerie',ty:'text',if:x=>needPlainte(x)&&x.plainte==='oui',sub:1},
  {k:'pompiers',l:'Les pompiers sont-ils intervenus ?',ty:'radio',o:YN,if:x=>x.type==='incendie'},
  {k:'constat',l:'Un constat amiable dégât des eaux a-t-il été rempli ?',ty:'radio',o:YN,if:x=>x.type==='dde',h:'Vous pouvez le faire dans l’onglet « Constat amiable » de l’appli.'},
  {k:'tiers',l:'Une autre personne est-elle responsable ou impliquée ?',ty:'radio',o:YN},
  {k:'tiersid',l:'Son nom, son adresse et son assureur, si vous les connaissez',ty:'area',if:x=>x.tiers==='oui',sub:1}]},
 {t:'Les dommages',fields:[

const MAXP=12;

const mkIDB=name=>{let p;
 const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(m,f)=>{const x=await db();return new Promise((res,rej)=>{const t=x.transaction('photos',m),r=f(t.objectStore('photos'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
 return{all:()=>tx('readonly',s=>s.getAll()),put:o=>tx('readwrite',s=>s.put(o)),del:id=>tx('readwrite',s=>s.delete(id)),clear:()=>tx('readwrite',s=>s.clear())};
};

async function shrink(file){
 let src;
 try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}
 catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('format d’image non pris en charge'));im.src=URL.createObjectURL(file)})}
 const sc=Math.min(1,1600/Math.max(src.width,src.height)),w=Math.round(src.width*sc),h=Math.round(src.height*sc);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(src,0,0,w,h);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));if(!blob)throw new Error('conversion impossible');
 return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),blob,w,h,cap:'',t:Date.now()};
}

   Ailleurs (iPhone, ordinateur, version web) : fichier .ics avec deux alarmes (3 jours avant et la veille à 9 h). */
const Agenda=(()=>{
 const P=(NATIVE&&CAP.Plugins)||{},TODAY=new Date().toISOString().slice(0,10);
 const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const frd=iso=>{const [y,m,dd]=iso.split('-');return `${dd}/${m}/${y}`};
 const next=iso=>{const t=new Date(iso+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10)};
 const escI=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
 const fold=l=>{const out=[];let s=l;while(s.length>60){out.push(s.slice(0,60));s=' '+s.slice(60)}out.push(s);return out.join('\r\n')};
 function ics(r){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),uid=Date.now()+'-'+Math.random().toString(36).slice(2)+'@vitfix.fr';
  const al=(trg)=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+escI(r.t),'TRIGGER:'+trg,'END:VALARM'];
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vitfix//Rappels//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+stamp,
   'DTSTART;VALUE=DATE:'+r.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+next(r.date).replace(/-/g,''),'SUMMARY:'+escI(r.t),'DESCRIPTION:'+escI(r.desc),'TRANSP:TRANSPARENT',
   ...al('-P2DT15H'),...al('-PT15H'),'END:VEVENT','END:VCALENDAR'].map(fold).join('\r\n')+'\r\n';
 }
 const ok=list=>(list||[]).filter(r=>r&&r.date&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&r.date>=TODAY);

 }
 async function add(r,msg){

  const url=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();

 }

})();

function setupSig(P){
 const cv=document.getElementById('sig'+P);if(!cv)return;
 const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 cv.width=r.width*dpr;cv.height=r.height*dpr;
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0a2a6b';
 ctx.clearRect(0,0,r.width,r.height);
 if(d['sig'+P]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=d['sig'+P]}
 let drawing=false,last=null;
 const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.1,0,7);ctx.fillStyle='#0a2a6b';ctx.fill()};
 cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};
 const end=()=>{if(!drawing)return;drawing=false;d['sig'+P]=trim(cv);save()};
 cv.onpointerup=end;cv.onpointercancel=end;
}
function trim(cv){
 const ctx=cv.getContext('2d'),{width:w,height:h}=cv,px=ctx.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<x0)return undefined;
 const pad=6;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w,x1+pad);y1=Math.min(h,y1+pad);
 const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
 // full canvas kept for redisplay; trimmed stored separately
 d['sigt'+cv.dataset.p]=o.toDataURL('image/png');
 return cv.toDataURL('image/png');
}

 const P=[];
 P.push(`Assuré(e) auprès de votre compagnie au titre du contrat n° ${c(x.contrat)||'...'}${ct?' ('+ct+')':''}, je vous déclare, conformément à l’article L113-2 du Code des assurances, le sinistre suivant : ${T}, survenu le ${fr(x.date)||'...'}${c(x.heure)?' ('+c(x.heure)+')':''}${x.decouv&&x.decouv!==x.date?' et constaté le '+fr(x.decouv):''}${lieu?', '+(/^\d/.test(lieu)?'au ':'à l’adresse suivante : ')+lieu:''}.`);

 if(needPlainte(x)&&x.plainte==='oui'){const inf=[c(x.pou),c(x.pno)&&'procès-verbal n° '+c(x.pno)].filter(Boolean).join(', ');P.push(`J’ai déposé plainte${x.pdate?' le '+fr(x.pdate):''}${inf?' ('+inf+')':''}. Le récépissé est joint à la présente.`)}
 if(needPlainte(x)&&x.plainte==='non')P.push('Je dépose plainte dans les meilleurs délais et vous transmettrai le récépissé.');
 if(x.type==='incendie'&&x.pompiers==='oui')P.push('Les sapeurs-pompiers sont intervenus.');
 if(x.type==='dde'&&x.constat==='oui')P.push('Un constat amiable dégât des eaux a été établi ; il vous est transmis avec la présente déclaration.');

 if(c(x.mesures))P.push('Mesures prises pour limiter les dommages : '+String(x.mesures).trim().replace(/\.$/,'')+'.');

 if(photos.length)P.push(`${photos.length} photo${photos.length>1?'s':''} du sinistre figure${photos.length>1?'nt':''} en annexe.`);
 P.push('Je vous remercie de bien vouloir enregistrer cette déclaration, de m’indiquer le numéro de dossier attribué et, si nécessaire, de missionner un expert. Je tiens à votre disposition tous les justificatifs utiles (factures, photos, devis).');
 P.push('Veuillez agréer, Madame, Monsieur, l’expression de mes salutations distinguées.');

function wrapT(text,f,size,w){
 const out=[];
 for(const para of String(text||'').split('\n')){
  const words=para.split(/\s+/).filter(Boolean);if(!words.length){out.push('');continue}
  let ln='';
  for(let wd of words){const t=ln?ln+' '+wd:wd;if(f.widthOfTextAtSize(t,size)<=w){ln=t;continue}
   if(ln){out.push(ln);ln=''}
   while(f.widthOfTextAtSize(wd,size)>w){let k=wd;while(k.length>1&&f.widthOfTextAtSize(k,size)>w)k=k.slice(0,-1);out.push(k);wd=wd.slice(k.length)}
   ln=wd}
  if(ln)out.push(ln);
 }
 return out;
}

async function nativeSend(bytes,{to,subj,body},dialog){
 const {Filesystem,Share,EmailIntent}=CAP.Plugins;
 const w=await Filesystem.writeFile({path:fname(),data:b64(bytes),directory:'CACHE'});
 if(to&&EmailIntent){await EmailIntent.send({to,subject:subj,body,files:[w.uri],title:dialog});return true}
 await Share.share({title:subj,text:body,files:[w.uri],dialogTitle:dialog});return false;
}
async function nativeSave(bytes){
 const {Filesystem}=CAP.Plugins;
 await Filesystem.writeFile({path:M().folder+'/'+fname(),data:b64(bytes),directory:'DOCUMENTS',recursive:true});
}
const cancelled=e=>/cancel|annul|abort/i.test(String(e&&(e.message||e.errorMessage)||e));

function webDownload(bytes){const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=fname();document.body.appendChild(a);a.click();a.remove();return url}
/* Envoi commun : renvoie le message à afficher */
async function sendMail(bytes,parts,dialog){
 const {to,subj,body}=parts;
 if(NATIVE){const pre=await nativeSend(bytes,parts,dialog);return pre||!to?'Mail prêt avec le PDF joint : vérifiez puis envoyez.':'Dans le mail, saisissez le destinataire : <b>'+esc(to)+'</b>'}
 const file=new File([bytes],fname(),{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:subj,text:body,files:[file]});return to?'Destinataire à saisir : <b>'+esc(to)+'</b>':'Partagé.'}
 webDownload(bytes);
 const href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
 location.href=href;
 return `PDF téléchargé. <a href="${href}">Ouvrir le mail prêt à envoyer</a> puis joignez-y le PDF.`;
}

function bindRecap(){
 Agenda.bind(reminders());
 const out=$('#out'),say=(t,err)=>out.innerHTML=`<div class="msg${err?' err':''}">${t}</div>`;
 const busy=async(b,fn)=>{const lab=b.textContent;b.disabled=true;b.textContent='Génération…';try{await fn(await buildPDF());Stats.ev('document_pdf',{document:mode})}catch(e){if(cancelled(e))say('Envoi annulé.');else say('Impossible de terminer : '+esc(e&&e.message||e),1)}b.disabled=false;b.textContent=lab};
 $('#dl').onclick=e=>busy(e.currentTarget,async bytes=>{
  if(NATIVE){
   try{await nativeSave(bytes);say(M().saved(fname()));return}
   catch(err){await nativeSend(bytes,{...M().mail(),to:''},'Enregistrer le PDF');say('Enregistrement direct impossible : choisissez où enregistrer le PDF (Fichiers, Drive…).');return}
  }
  const url=webDownload(bytes);say('Si le téléchargement ne démarre pas, <a href="'+url+'" target="_blank" rel="noopener">ouvrez le PDF ici</a>.');
 });
 $('#mail').onclick=e=>busy(e.currentTarget,async bytes=>say(await sendMail(bytes,M().mail(),mode==='decl'?'Envoyer la déclaration':mode==='contest'?'Envoyer la contestation':'Envoyer le constat')));
 const ld=$('#lrar-dl');if(ld)ld.onclick=()=>$('#dl').click();
 const lc=$('#lrar-copy');if(lc)lc.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(lrarAddr());ok=true}catch(e){try{const r=document.createRange();r.selectNodeContents($('#lrar-addr'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);ok=document.execCommand('copy')}catch(x){}}lc.textContent=ok?'✓ Adresse copiée':'Sélectionnez l’adresse et copiez-la';setTimeout(()=>lc.textContent='Copier l’adresse de l’assureur',2500)};
 document.querySelectorAll('[data-devis]').forEach(b=>b.onclick=e=>busy(e.currentTarget,async bytes=>say(await sendMail(bytes,devisParts(b.dataset.devis),'Demander un devis'))));
}
function clean1(s){return String(s||'').replace(/\s+/g,' ').trim()}

/* Mesure d'audience : Firebase Analytics, appli Android seulement, et seulement si l'utilisateur l'accepte (choix gardé dans cdde_stats).
   Aucune donnée saisie n'est envoyée : seulement l'onglet ouvert et la création d'un PDF. Refuser est aussi simple qu'accepter. */
const Stats=(()=>{
 const F=NATIVE&&CAP.Plugins&&CAP.Plugins.FirebaseAnalytics,K='cdde_stats';let on=false;
 const get=()=>{try{return localStorage.getItem(K)}catch(e){return null}};
 async function apply(){on=!!F&&get()==='oui';if(!F)return;try{await F.setConsent({type:'ANALYTICS_STORAGE',status:on?'GRANTED':'DENIED'});await F.setEnabled({enabled:on})}catch(e){}}
 function ask(){
  if(!F||document.getElementById('statsbox'))return;
  const b=document.createElement('div');b.id='statsbox';b.setAttribute('role','dialog');b.setAttribute('aria-label','Mesure d’audience');
  b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card,#fff);border-top:1px solid var(--line,#d8e0e8);box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:16px 16px calc(16px + env(safe-area-inset-bottom));font-size:14px';
  b.innerHTML='<p style="margin:0 0 6px"><b>Nous aider à améliorer l’appli ?</b></p><p style="margin:0 0 12px">Avec votre accord, l’appli mesure sa fréquentation (écrans ouverts, PDF créés) avec Google Analytics pour Firebase. <b>Le contenu de vos constats et déclarations n’est jamais envoyé.</b> Vous pouvez changer d’avis à tout moment (lien « Mesure d’audience » en bas de l’écran).</p><div style="display:flex;gap:10px"><button type="button" class="btn" id="stno">Refuser</button><button type="button" class="btn" id="styes">Accepter</button></div>';
  document.body.appendChild(b);
  const set=v=>{try{localStorage.setItem(K,v)}catch(e){}b.remove();apply();link()};
  b.querySelector('#stno').onclick=()=>set('non');b.querySelector('#styes').onclick=()=>set('oui');
 }
 function link(){
  if(!F)return;let l=document.getElementById('statslink');
  if(!l){l=document.createElement('p');l.id='statslink';l.style.cssText='text-align:center;font-size:12.5px;margin:18px 0 0;color:var(--mute,#55697a)';document.querySelector('main').appendChild(l)}
  l.innerHTML=`Mesure d’audience : ${get()==='oui'?'acceptée':'refusée'} — <a href="#" id="statschg">modifier</a>`;
  l.querySelector('#statschg').onclick=e=>{e.preventDefault();ask()};
 }
 function init(){if(!F)return;apply();link();if(get()===null)setTimeout(ask,1200)}
 const ev=(name,params)=>{if(on&&F)F.logEvent({name,params:params||{}}).catch(()=>{})};
 const screen=n=>{if(on&&F)F.setCurrentScreen({screenName:n}).catch(()=>{})};
 return {init,ev,screen};
})();
setMode(mode);
Stats.init();
window.addEventListener('resize',()=>{if(STEPS[cur].sign)STEPS[cur].sign.forEach(setupSig)});
window.__cdde={build:()=>buildPDF(),letter:()=>dletter(),cletter:()=>cletter(),setMode};

/* Bouton retour Android = étape précédente ; quitte l'appli à la 1re étape */
if(NATIVE&&CAP.Plugins.App){
 CAP.Plugins.App.addListener('backButton',()=>{if(cur>0){cur--;render()}else CAP.Plugins.App.exitApp()});
}
if(NATIVE&&CAP.Plugins.SplashScreen)CAP.Plugins.SplashScreen.hide();
}
</script>
